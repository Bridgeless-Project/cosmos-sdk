syntax = "proto3";
package cosmos.nft;

import "cosmos/base/v1beta1/coin.proto";
import "google/protobuf/timestamp.proto";
import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/nft/params.proto";
import "google/protobuf/any.proto";

import "cosmos/msg/v1/msg.proto";
import "cosmos/staking/v1beta1/staking.proto";


// this line is used by starport scaffolding # proto/tx/import
option go_package = "github.com/cosmos/cosmos-sdk/x/nft/types";

// Msg defines the Msg service.
service Msg {
  rpc Send(MsgSend) returns (MsgSendResponse);

  rpc Withdraw (MsgWithdrawal) returns (MsgWithdrawalResponse);

  rpc Undelegate(MsgUndelegate) returns (MsgUndelegateResponse);

  rpc Delegate(MsgDelegate) returns (MsgDelegateResponse);

  rpc Redelegate ( MsgRedelegate) returns (MsgRedelegateResponse);

  rpc Mint (MsgMint) returns (MsgMintResponse);

  rpc BecameValidator(MsgBecameValidator) returns (MsgBecameValidatorResponse);

  rpc StakingWithdrawalRewards(MsgStakingWithdrawalRewards) returns (MsgStakingWithdrawalRewardsResponse);
}

message MsgWithdrawal {
  string creator = 1;
  string nft = 2;
  cosmos.base.v1beta1.Coin amount = 3 [(gogoproto.nullable) = false];
}

message MsgWithdrawalResponse {}

message MsgDelegate {
  string creator = 1;
  string nft = 2;
  string validator = 3;
  cosmos.base.v1beta1.Coin amount = 4 [(gogoproto.nullable) = false];
}

message MsgDelegateResponse {}

message MsgUndelegate {
  string creator = 1;
  string nft = 2;
  string validator = 3;
  cosmos.base.v1beta1.Coin amount = 4 [(gogoproto.nullable) = false];
}

message MsgUndelegateResponse {}

message MsgSend {
  string creator = 1;
  string nft = 2;
  string recipient = 3;
  cosmos.base.v1beta1.Coin amount = 4 [(gogoproto.nullable) = false]; // allow us to stake only the part of NFT
}

message MsgSendResponse {}

message MsgRedelegate {
  string creator = 1;
  string nft = 2;
  string validatorSrc = 3;
  string validatorNew = 4;
  cosmos.base.v1beta1.Coin amount = 5 [(gogoproto.nullable) = false];
}

message MsgRedelegateResponse {}

message MsgMint {
  string creator = 1;
  string owner = 2;
  int64 start_vesting_block = 3;
  string nft_metadata_uri = 4;
}

message MsgMintResponse {}

message MsgBecameValidator{
  option (cosmos.msg.v1.signer) = "delegator_address";
  option (cosmos.msg.v1.signer) = "validator_address";

  option (gogoproto.equal)           = false;
  option (gogoproto.goproto_getters) = false;

  cosmos.staking.v1beta1.Description     description         = 1 [(gogoproto.nullable) = false];
  cosmos.staking.v1beta1.CommissionRates commission          = 2 [(gogoproto.nullable) = false];
  string          min_self_delegation = 3 [
    (cosmos_proto.scalar)  = "cosmos.Int",
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Int",
    (gogoproto.nullable)   = false
  ];
  string                   delegator_address = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string                   validator_address = 5 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  google.protobuf.Any      pubkey            = 6 [(cosmos_proto.accepts_interface) = "cosmos.crypto.PubKey"];
  repeated string nfts = 7 [
    (gogoproto.nullable) = false,
    (cosmos_proto.scalar) = "cosmos.AddressString"
  ];
}

message MsgBecameValidatorResponse {}

message MsgStakingWithdrawalRewards {
  string creator = 1;
  string validator = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string nft = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"]; // nft address
}

message MsgStakingWithdrawalRewardsResponse {}