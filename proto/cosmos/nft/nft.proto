syntax = "proto3";
package cosmos.nft;

import "google/protobuf/any.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "google/api/annotations.proto";
import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";

option go_package = "github.com/cosmos/cosmos-sdk/x/nft/types";

// NFT defines the NFT.
message NFT {

  string address = 1;

  string owner = 2;

  string uri = 3;

  // reward_per_period is the unlock step in tokens per vesting period.
  cosmos.base.v1beta1.Coin reward_per_period = 4 [(gogoproto.nullable) = false];

  int64 last_vesting_block = 5;

  string denom = 6;

  int64 start_vesting_block = 7;

  // token_amount is the vesting entitlement (100%); only MsgTopUp changes it.
  cosmos.base.v1beta1.Coin token_amount = 8 [(gogoproto.nullable) = false];

  // unlocked_amount is the cumulative amount unlocked so far (never decreases on withdrawal).
  cosmos.base.v1beta1.Coin unlocked_amount = 9 [(gogoproto.nullable) = false];

  // withdrawn_amount is the cumulative amount withdrawn by the owner before the full unlock.
  cosmos.base.v1beta1.Coin withdrawn_amount = 10 [(gogoproto.nullable) = false];
}

message Owner {
  string address = 1;
  string nft_address = 2;
}

