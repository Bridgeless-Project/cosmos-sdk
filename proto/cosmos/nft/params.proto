syntax = "proto3";
package cosmos.nft;

import "gogoproto/gogo.proto";
import "cosmos/nft/nft.proto";

option go_package = "github.com/cosmos/cosmos-sdk/x/nft/types";

// Params defines the parameters for the module.
message Params {
  string module_admin = 1;
  string bond_denom = 2;
  string prefix = 3;
  uint64 nft_sequence = 4;
}
