syntax = "proto3";
package cosmos.nft;

import "gogoproto/gogo.proto";
import "cosmos/nft/nft.proto";

option go_package = "github.com/cosmos/cosmos-sdk/x/nft/types";

// Params defines the parameters for the module.
message Params {
  string module_admin = 1;
  string bond_denom = 2;
  string prefix = 3;
  uint64 nft_sequence = 4;
  uint64 vesting_period = 5;
  uint64 vesting_periods_count = 6;
  uint64 nft_cost = 7;
  uint64 batch_size = 8;
  uint64 batch_index = 9;
}
